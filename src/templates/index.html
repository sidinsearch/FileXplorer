<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Search for open directories. Find DDL for movies, TV, books, etc.">
    <title>FileXplorer</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="{{ url_for('static', filename='css/custom_styles.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/dark_mode.css') }}" rel="stylesheet" id="darkModeStyles">

    <style>
        .dark-mode-toggle-container {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        .sun, .moon {
            position: relative;
            z-index: 1001;
        }
        .dark-mode-toggle-container .switch {
            position: relative;
            z-index: 1000;
        }
        .sun, .moon {
            position: absolute;
            top: 49%;
            transform: translateY(-50%);
        }
        .sun { left: 6px; }
        .moon { right: 6px; }
    </style>
</head>

<body>

    <div class="dark-mode-toggle-container">
        <label class="switch">
            <span class="sun">☀️</span>
            <input type="checkbox" onclick="toggleDarkMode(); toggleEmojis();">
            <span class="slider round"></span>
            <span class="moon">🌙</span>
        </label>
    </div>

    <script>
        var darkModeStyles = document.getElementById('darkModeStyles');
        var darkModeToggle = document.querySelector('.switch input');
        darkModeStyles.href = '';

        function toggleEmojis() {
            var sun = document.querySelector('.sun');
            var moon = document.querySelector('.moon');
            if (darkModeToggle.checked) {
                sun.style.display = 'none';
                moon.style.display = 'inline';
            } else {
                sun.style.display = 'inline';
                moon.style.display = 'none';
            }
        }
        toggleEmojis();

        function toggleDarkMode() {
            darkModeStyles.href = darkModeToggle.checked ? '{{ url_for("static", filename="css/dark_mode.css") }}' : '';
            toggleEmojis();
        }
    </script>

    <div class="container">
        <!-- Search Box -->
        <div class="search-box">
            <img class="mb-3" src="{{ url_for('static', filename='img/logo.png') }}" alt="FileXplorer" width="64" height="64">
            <h1 class="h3 mb-2">FileXplorer</h1>
            <p class="text-muted mb-3">Find Open Directories &amp; Direct Magnet Links. Uses DuckDuckGo dorking &amp; torrent indexing.</p>

            <div class="input-group mb-3">
                <input type="text" id="searchTerm" class="form-control" placeholder="Search term..." autofocus
                       onkeydown="if(event.key==='Enter'){event.preventDefault();search();}">
                <div class="input-group-append">
                    <button class="btn btn-primary" type="button" onclick="search()">EXPLORE</button>
                </div>
            </div>

            <div class="text-center mb-2">
                <label class="radio-inline mr-3">
                    <input id="o1" type="radio" name="optradio" checked> Everything 🌐
                </label>
                <label class="radio-inline mr-3">
                    <input id="o2" type="radio" name="optradio"> Video 🎥
                </label>
                <label class="radio-inline mr-3">
                    <input id="o3" type="radio" name="optradio"> Audio 🎵
                </label>
                <label class="radio-inline mr-3">
                    <input id="o4" type="radio" name="optradio"> eBook 📚
                </label>
                <label class="radio-inline">
                    <input id="o5" type="radio" name="optradio"> Software 💻
                </label>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingAnimation" class="text-center my-4" style="display:none;">
            <div class="loading"></div>
        </div>

        <!-- Results: two columns -->
        <div class="row results-row">
            <div class="col-md-6">
                <div id="searchResults"></div>
            </div>
            <div class="col-md-6">
                <div id="torrentResults"></div>
            </div>
        </div>

        <p id="madeWithBy" class="mt-4 mb-3 text-muted text-center">MADE WITH ❤️ BY SIDINSEARCH</p>

        <!-- Legend -->
        <div class="legend-container">
            <div class="legend-item"><span class="legend-emoji">📁</span> Directory</div>
            <div class="legend-item"><span class="legend-emoji">🧲</span> Magnet Link</div>
            <div class="legend-item"><span class="legend-emoji">📄</span> Reference Page</div>
        </div>
    </div>

    <!-- Disclaimer -->
    <div class="fixed-bottom p-3 text-center" id="disclaimerContainer">
        <p class="text-dark m-0">
            <span id="disclaimerText" class="bg-transparent text-dark px-2 py-1 rounded disclaimer-font">
                ⚠️ Disclaimer: FileXplorer Indexes Publicly Available Files And Does Not Host Any Copyrighted Content. Use Responsibly.
            </span>
        </p>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
</body>

</html>
